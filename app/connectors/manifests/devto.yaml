key: devto
name: Dev.to Developer Publishing
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: article
    content_types: [text, markdown, image]
    spec:
      title_min_chars: 5
      title_max_chars: 128
      body_min_chars: 50
      body_max_chars: 50000
      links_allowed: true
      max_tags: 4
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 30
capabilities: [validate, publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "500": PLATFORM_UNAVAILABLE
instance_param: none
