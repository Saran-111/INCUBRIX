key: hashnode
name: Hashnode Developer Publication
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: story
    content_types: [text, markdown, image]
    spec:
      title_min_chars: 5
      title_max_chars: 200
      body_min_chars: 50
      body_max_chars: 100000
      links_allowed: true
      max_tags: 5
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 60
capabilities: [validate, publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "500": PLATFORM_UNAVAILABLE
instance_param: publication_id
