key: lemmy
name: Lemmy Federated Community
version: 1.0.0
tier: protocol
auth: api_key
surfaces:
  - key: post
    content_types: [text, image, link]
    spec:
      title_min_chars: 3
      title_max_chars: 200
      body_min_chars: 0
      body_max_chars: 10000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 60
capabilities: [validate, publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "400": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "500": PLATFORM_UNAVAILABLE
  "502": PLATFORM_UNAVAILABLE
instance_param: base_url
