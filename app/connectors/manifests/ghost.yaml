key: ghost
name: Ghost Publishing Platform
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: post
    content_types: [text, html, markdown, image]
    spec:
      title_min_chars: 1
      title_max_chars: 255
      body_min_chars: 1
      body_max_chars: 100000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 60
    per_seconds: 60
capabilities: [validate, publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "500": PLATFORM_UNAVAILABLE
instance_param: base_url
