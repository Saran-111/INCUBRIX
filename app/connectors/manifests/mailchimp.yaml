key: mailchimp
name: Mailchimp Campaign Newsletter
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: campaign
    content_types: [text, html, image]
    spec:
      title_min_chars: 1
      title_max_chars: 150
      body_min_chars: 10
      body_max_chars: 200000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 60
capabilities: [validate, publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
  "400": PLATFORM_CONTENT_REJECTED
  "500": PLATFORM_UNAVAILABLE
instance_param: list_id
