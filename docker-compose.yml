version: "3.8"

services:
  service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix_service
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=IncuBrix Long-Tail Distribution Connector Service
      - SIMULATION_MODE=${SIMULATION_MODE:-true}
      - STORAGE_TYPE=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=incubrix-artifacts
      - GHOST_BASE_URL=http://ghost:2368
      - LEMMY_BASE_URL=http://lemmy:8536
    depends_on:
      minio:
        condition: service_healthy
      ghost:
        condition: service_started
      lemmy:
        condition: service_healthy
    volumes:
      - ./data/evidence:/app/data/evidence
      - ./storage_data:/app/storage_data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: incubrix_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    restart: unless-stopped

  ghost:
    image: ghost:5-alpine
    container_name: incubrix_ghost
    ports:
      - "2368:2368"
    environment:
      - NODE_ENV=development
      - url=http://localhost:2368
    restart: unless-stopped

  lemmy:
    image: python:3.11-slim
    container_name: incubrix_lemmy_mock
    ports:
      - "8536:8536"
    volumes:
      - ./app/mocks/lemmy_service.py:/app/lemmy_service.py:ro
    command: python -u /app/lemmy_service.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8536/api/v3/post?id=0')"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  minio_data:
